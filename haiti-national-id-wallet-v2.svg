<svg xmlns="http://www.w3.org/2000/svg" width="350" height="690" viewBox="0 0 350 690">
  <!-- Haiti Wallet VC card sourced from inji-config. SVG contains only visual elements and claim placeholders. QR is populated by the Wallet as a companion credential panel. -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7fafc"/>
      <stop offset="100%" stop-color="#edf3f8"/>
    </linearGradient>
  </defs>
  <rect width="350" height="690" rx="14" fill="#ffffff"/>
  <rect x="0" width="175" height="7" fill="#1849a3"/>
  <rect x="175" width="175" height="7" fill="#c83248"/>
  <rect x="0" y="7" width="350" height="127" fill="#112b43"/>
  <text x="18" y="32" fill="#a8c7d7" font-family="sans-serif" font-size="10" font-weight="bold">HAÏTI  /  IDENTITÉ NUMÉRIQUE</text>
  <text x="18" y="65" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">Carte d'Identification</text>
  <text x="18" y="91" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">Nationale</text>
  <text x="18" y="113" fill="#d1e3ea" font-family="sans-serif" font-size="10">OFFICE NATIONAL D'IDENTIFICATION</text>
  <rect y="134" width="350" height="5" fill="#5f8a8b"/>
  <rect y="139" width="350" height="545" fill="url(#paper)"/>
  <text x="18" y="163" fill="#477487" font-family="sans-serif" font-size="10" font-weight="bold">INFORMATIONS DU TITULAIRE</text>
  <rect x="16" y="176" width="318" height="480" rx="10" fill="#ffffff" stroke="#e3eaf0"/>
  <rect x="26" y="188" width="96" height="120" rx="7" fill="#eaf1f5" stroke="#d5dfe8"/>
  <text x="74" y="243" text-anchor="middle" fill="#698093" font-family="sans-serif" font-size="11">PHOTO</text>
  <text x="74" y="259" text-anchor="middle" fill="#698093" font-family="sans-serif" font-size="11">D'IDENTITÉ</text>
  <text x="26" y="321" fill="#71869a" font-family="sans-serif" font-size="9">PHOTO D'IDENTITÉ</text>
  <text x="135" y="203" fill="#5b7488" font-family="sans-serif" font-size="10">Nom</text>
  <text x="135" y="221" fill="#163149" font-family="sans-serif" font-size="13" font-weight="bold">{{credentialSubject/lastName}}</text>
  <text x="135" y="244" fill="#5b7488" font-family="sans-serif" font-size="10">Prénom</text>
  <text x="135" y="262" fill="#163149" font-family="sans-serif" font-size="13" font-weight="bold">{{credentialSubject/firstName}}</text>
  <text x="135" y="285" fill="#5b7488" font-family="sans-serif" font-size="10">Deuxième prénom</text>
  <text x="135" y="302" fill="#163149" font-family="sans-serif" font-size="11" font-weight="bold">{{credentialSubject/middleName}}</text>
  <line x1="26" y1="338" x2="323" y2="338" stroke="#e7edf2"/>
  <text x="26" y="357" fill="#5b7488" font-family="sans-serif" font-size="10">UIN / VID</text>
  <text x="26" y="376" fill="#163149" font-family="sans-serif" font-size="14" font-weight="bold">{{wallet/individualId}}</text>
  <line x1="26" y1="389" x2="323" y2="389" stroke="#e7edf2"/>
  <text x="26" y="409" fill="#5b7488" font-family="sans-serif" font-size="10">Date de naissance</text>
  <text x="26" y="427" fill="#163149" font-family="sans-serif" font-size="13" font-weight="bold">{{credentialSubject/dateOfBirth}}</text>
  <text x="183" y="409" fill="#5b7488" font-family="sans-serif" font-size="10">Sexe</text>
  <text x="183" y="427" fill="#163149" font-family="sans-serif" font-size="13" font-weight="bold">{{credentialSubject/gender}}</text>
  <line x1="26" y1="440" x2="323" y2="440" stroke="#e7edf2"/>
  <text x="26" y="461" fill="#5b7488" font-family="sans-serif" font-size="10">Département</text>
  <text x="26" y="479" fill="#163149" font-family="sans-serif" font-size="12" font-weight="bold">{{credentialSubject/department}}</text>
  <text x="183" y="461" fill="#5b7488" font-family="sans-serif" font-size="10">Commune</text>
  <text x="183" y="479" fill="#163149" font-family="sans-serif" font-size="12" font-weight="bold">{{credentialSubject/commune}}</text>
  <line x1="26" y1="493" x2="323" y2="493" stroke="#e7edf2"/>
  <text x="26" y="514" fill="#5b7488" font-family="sans-serif" font-size="10">Section communale</text>
  <text x="26" y="534" fill="#163149" font-family="sans-serif" font-size="12" font-weight="bold">{{credentialSubject/communalSection}}</text>
  <text x="26" y="558" fill="#5b7488" font-family="sans-serif" font-size="10">Localité</text>
  <text x="26" y="577" fill="#163149" font-family="sans-serif" font-size="12" font-weight="bold">{{credentialSubject/locality}}</text>
  <line x1="26" y1="592" x2="323" y2="592" stroke="#e7edf2"/>
  <text x="26" y="612" fill="#477487" font-family="sans-serif" font-size="10" font-weight="bold">MOSIP  •  ATTESTATION NUMÉRIQUE</text>
  <text x="26" y="631" fill="#698093" font-family="sans-serif" font-size="9">Données issues du justificatif signé</text>
  <text x="175" y="671" text-anchor="middle" fill="#8193a3" font-family="sans-serif" font-size="9">MOSIP  •  DOCUMENT NUMÉRIQUE  •  HAÏTI</text>
  <rect y="684" width="175" height="6" fill="#1849a3"/>
  <rect x="175" y="684" width="175" height="6" fill="#c83248"/>
</svg>
