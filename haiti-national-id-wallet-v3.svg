<svg xmlns="http://www.w3.org/2000/svg" width="350" height="{{wallet/cardHeight}}" viewBox="0 0 350 {{wallet/cardHeight}}">
  <!-- Haiti Wallet v3: maintain layout in inji-config; Manas-style claim rows
       are populated by the Wallet from the actual signed VC.
       QR is rendered below the SVG using Claim169 or verified PixelPass data. -->
  <defs>
    <linearGradient id="haitiBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7fafc"/>
      <stop offset="100%" stop-color="#edf3f8"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="350" height="{{wallet/cardHeight}}" rx="16" fill="#ffffff"/>
  <rect x="0" y="0" width="175" height="7" fill="#1849a3"/>
  <rect x="175" y="0" width="175" height="7" fill="#c83248"/>
  <rect x="0" y="7" width="350" height="132" fill="#112b43"/>
  <text x="18" y="31" font-size="10" font-weight="bold" fill="#a8c7d7" font-family="sans-serif">HAÏTI / IDENTITÉ NUMÉRIQUE</text>
  <text x="18" y="65" font-size="20" font-weight="bold" fill="#ffffff" font-family="sans-serif">Carte d'Identification</text>
  <text x="18" y="91" font-size="20" font-weight="bold" fill="#ffffff" font-family="sans-serif">Nationale</text>
  <text x="18" y="116" font-size="10" fill="#d1e3ea" font-family="sans-serif">OFFICE NATIONAL D'IDENTIFICATION</text>
  <rect x="0" y="139" width="350" height="{{wallet/bodyHeight}}" fill="url(#haitiBg)"/>
  <text x="18" y="165" font-size="10" font-weight="bold" fill="#477487" font-family="sans-serif">INFORMATIONS DU TITULAIRE</text>
  <rect x="16" y="178" width="318" height="{{wallet/panelHeight}}" rx="10" fill="#ffffff" stroke="#e3eaf0"/>
  <rect x="26" y="190" width="96" height="121" rx="7" fill="#eaf1f5" stroke="#d5dfe8"/>
  <text x="74" y="244" font-size="11" fill="#698093" font-family="sans-serif" text-anchor="middle">PHOTO</text>
  <text x="74" y="260" font-size="11" fill="#698093" font-family="sans-serif" text-anchor="middle">D'IDENTITÉ</text>
  <text x="26" y="327" font-size="9" fill="#71869a" font-family="sans-serif">PHOTO D'IDENTITÉ</text>
  <text x="135" y="208" font-size="10" fill="#5b7488" font-family="sans-serif">Nom complet</text>
  <text x="135" y="231" font-size="14" font-weight="bold" fill="#163149" font-family="sans-serif">{{wallet/fullNameLine1}}</text>
  <text x="135" y="251" font-size="14" font-weight="bold" fill="#163149" font-family="sans-serif">{{wallet/fullNameLine2}}</text>
  <text x="135" y="279" font-size="10" fill="#71869a" font-family="sans-serif">Pièce d'identité numérique</text>
  <line x1="26" y1="344" x2="324" y2="344" stroke="#e7edf2"/>
  <!-- Rows dynamically generated from the credentialSubject using the
       same recursive field resolution as Manas Wallet. -->
  <g id="haiti-credential-claims">
    {{wallet/claimRowsSvg}}
  </g>
  <text x="175" y="{{wallet/footerY}}" font-size="9" text-anchor="middle" fill="#8193a3" font-family="sans-serif">MOSIP • DOCUMENT NUMÉRIQUE • HAÏTI</text>
  <rect x="0" y="{{wallet/flagY}}" width="175" height="6" fill="#1849a3"/>
  <rect x="175" y="{{wallet/flagY}}" width="175" height="6" fill="#c83248"/>
</svg>
