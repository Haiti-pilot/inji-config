<svg xmlns="http://www.w3.org/2000/svg" width="350" height="{{wallet/cardHeight}}" viewBox="0 0 350 {{wallet/cardHeight}}">
  <!-- Haiti wallet credential. The app injects verified VC claim rows and renders its QR independently. -->
  <defs>
    <linearGradient id="ht-header" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071F40"/>
      <stop offset="54%" stop-color="#133E70"/>
      <stop offset="100%" stop-color="#205C82"/>
    </linearGradient>
    <linearGradient id="ht-paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FBFF"/>
      <stop offset="55%" stop-color="#F0F6FC"/>
      <stop offset="100%" stop-color="#FFF8F6"/>
    </linearGradient>
    <linearGradient id="ht-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4A65C"/>
      <stop offset="100%" stop-color="#F1DCAA"/>
    </linearGradient>
  </defs>

  <!-- Full, dynamically sized card surface; no external images or fonts. -->
  <rect x="1" y="1" width="348" height="{{wallet/cardHeight}}" rx="15" fill="url(#ht-paper)" stroke="#D5E3EC" stroke-width="1.5"/>
  <rect x="2" y="2" width="346" height="150" rx="14" fill="url(#ht-header)"/>
  <rect x="2" y="137" width="346" height="16" fill="url(#ht-header)"/>
  <rect x="2" y="2" width="173" height="6" fill="#1646B6"/>
  <rect x="175" y="2" width="173" height="6" fill="#D73652"/>
  <circle cx="321" cy="142" r="89" fill="#FFFFFF" fill-opacity=".03"/>
  <circle cx="321" cy="142" r="68" fill="none" stroke="#FFFFFF" stroke-opacity=".12"/>
  <path d="M6 132 C75 99 128 152 205 119" stroke="#FFFFFF" stroke-width="1.3" stroke-opacity=".15" fill="none"/>

  <!-- Haitian national colors: clean vector flag mark, purposefully no external linked emblem. -->
  <rect x="275" y="16" width="59" height="47" rx="6" fill="#FFFFFF" fill-opacity=".96"/>
  <rect x="280" y="21" width="49" height="18" rx="1" fill="#00209F"/>
  <rect x="280" y="39" width="49" height="18" rx="1" fill="#D21034"/>
  <rect x="297" y="31" width="15" height="16" rx="1" fill="#FFFFFF"/>
  <path d="M304.5 34 L304.5 44 M301 42 Q304.5 34 308 42" stroke="#23724F" stroke-width="1.7" fill="none"/>
  <path d="M299 45 L310 45" stroke="#B88A45" stroke-width="1.3" fill="none"/>

  <text x="19" y="30" font-family="sans-serif" font-size="10" font-weight="bold" letter-spacing="1.2" fill="#DDEBF7">RÉPUBLIQUE D'HAÏTI</text>
  <text x="19" y="62" font-family="sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">Carte d'Identification</text>
  <text x="19" y="88" font-family="sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">Nationale</text>
  <text x="19" y="112" font-family="sans-serif" font-size="9" letter-spacing=".45" fill="#D8E7F4">OFFICE NATIONAL D'IDENTIFICATION</text>
  <rect x="19" y="129" width="59" height="3" rx="1.5" fill="url(#ht-gold)"/>

  <!-- Identity details and photo placeholder; real photo cannot be invented from VC. -->
  <text x="19" y="173" font-family="sans-serif" font-size="10" font-weight="bold" letter-spacing="1.15" fill="#1C4D77">INFORMATIONS DU TITULAIRE</text>
  <rect x="15" y="184" width="320" height="{{wallet/panelHeight}}" rx="12" fill="#FFFFFF" stroke="#DFE8EF" stroke-width="1.2"/>
  <rect x="21" y="190" width="308" height="141" rx="9" fill="#F0F6FA"/>
  <rect x="26" y="196" width="96" height="127" rx="8" fill="#FFFFFF" stroke="#C8D9E5"/>
  <rect x="31" y="201" width="86" height="114" rx="6" fill="#E8F0F6"/>
  <circle cx="74" cy="242" r="17" fill="#C6D9E7"/>
  <path d="M46 288 Q48 264 74 263 Q100 264 102 288 L102 298 L46 298 Z" fill="#C6D9E7"/>
  <text x="74" y="309" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#5C7A91">PHOTO</text>

  <text x="133" y="210" font-family="sans-serif" font-size="9.3" font-weight="bold" letter-spacing=".7" fill="#5A7A96">NOM COMPLET</text>
  <text x="133" y="235" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#173654">{{wallet/fullNameLine1}}</text>
  <text x="133" y="256" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#173654">{{wallet/fullNameLine2}}</text>
  <rect x="133" y="273" width="185" height="29" rx="7" fill="#E3F0EC"/>
  <circle cx="145" cy="287" r="4" fill="#26816A"/>
  <text x="156" y="291" font-family="sans-serif" font-size="9.4" font-weight="bold" fill="#246B5F">JUSTIFICATIF NUMÉRIQUE</text>
  <line x1="27" y1="341" x2="323" y2="341" stroke="#E0E8F0" stroke-width="1.2"/>

  <!-- Wallet fills this section at y=355 and calculates all row spacing and card height. -->
  <g id="haiti-credential-claims">
    {{wallet/claimRowsSvg}}
  </g>

  <text x="175" y="{{wallet/footerY}}" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#668298">MOSIP  •  DOCUMENT NUMÉRIQUE  •  HAÏTI</text>
  <rect x="2" y="{{wallet/flagY}}" width="173" height="6" fill="#1646B6"/>
  <rect x="175" y="{{wallet/flagY}}" width="173" height="6" fill="#D73652"/>
</svg>
